<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다목적 AI 챗봇 프로토타입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --theme-bg: #e0f2fe; /* sky-100 */
            --theme-primary: #3b82f6; /* blue-500 */
            --theme-primary-hover: #2563eb; /* blue-600 */
            --theme-bubble-bot: #ffffff;
            --theme-bubble-user: #3b82f6;
            --theme-text-user: #ffffff;
        }

        body.theme-blue {
            --theme-bg: #e0f2fe;
            --theme-primary: #3b82f6;
            --theme-primary-hover: #2563eb;
            --theme-bubble-user: #3b82f6;
        }
        body.theme-green {
            --theme-bg: #d1fae5;
            --theme-primary: #10b981;
            --theme-primary-hover: #059669;
            --theme-bubble-user: #10b981;
        }
        body.theme-yellow {
            --theme-bg: #fef3c7;
            --theme-primary: #f59e0b;
            --theme-primary-hover: #d97706;
            --theme-bubble-user: #f59e0b;
        }
        body.theme-purple {
            --theme-bg: #ede9fe;
            --theme-primary: #8b5cf6;
            --theme-primary-hover: #7c3aed;
            --theme-bubble-user: #8b5cf6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--theme-bg);
            transition: background-color 0.5s ease;
        }

        .bg-theme-primary { background-color: var(--theme-primary); transition: background-color 0.5s ease; }
        .text-theme-primary { color: var(--theme-primary); transition: color 0.5s ease; }
        .border-theme-primary { border-color: var(--theme-primary); transition: border-color 0.5s ease; }
        .hover-bg-theme-primary:hover { background-color: var(--theme-primary-hover); }
        
        .bubble-user {
            background-color: var(--theme-bubble-user);
            color: var(--theme-text-user);
            border-bottom-right-radius: 4px;
            transition: background-color 0.5s ease;
        }
        .bubble-bot {
            background-color: var(--theme-bubble-bot);
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--theme-primary);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .markdown-body p { margin-bottom: 0.5em; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body strong { font-weight: 600; color: #111827; }

        .safe-pb { padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
        * { -webkit-tap-highlight-color: transparent; }
        textarea:focus { outline: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="theme-blue h-[100dvh] w-screen overflow-hidden flex flex-col items-center bg-gray-50 sm:p-6 text-gray-800 transition-colors duration-500 overscroll-none select-none">

    <div class="w-full max-w-4xl h-full flex flex-col bg-white/90 sm:bg-white/60 backdrop-blur-md sm:shadow-2xl sm:rounded-3xl overflow-hidden border-0 sm:border border-white/40">
        
        <header class="flex justify-between items-center px-4 py-3 sm:px-8 sm:py-5 bg-white/95 border-b border-gray-200/50 pt-[calc(0.75rem+env(safe-area-inset-top,0px))] shadow-sm z-10">
            <div class="flex items-center gap-2 sm:gap-3">
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-theme-primary flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-robot text-sm sm:text-xl"></i>
                </div>
                <h1 class="text-base sm:text-xl font-bold tracking-tight text-gray-800 truncate">AI 어시스턴트</h1>
                <button onclick="clearHistory()" class="ml-2 text-gray-400 hover:text-red-500 transition-colors" title="현재 탭 대화 기록 지우기">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
            
            <div class="flex items-center bg-gray-100 rounded-full px-3 py-1.5 sm:px-4 sm:py-2 border border-gray-200 focus-within:border-theme-primary transition-all max-w-[140px] sm:max-w-none">
                <i class="fa-solid fa-key text-gray-400 mr-1.5 sm:mr-2 text-xs sm:text-sm"></i>
                <input type="password" id="api-key-input" placeholder="API Key 입력" 
                       class="bg-transparent border-none outline-none text-xs sm:text-sm w-full text-gray-700 placeholder-gray-400 select-text"
                       title="기본 키 실패 시 여기에 본인의 새 API 키를 입력하세요.">
            </div>
        </header>

        <nav class="flex border-b border-gray-200 bg-white/80 w-full z-10">
            <button onclick="switchTab('engKor')" id="tab-engKor" class="tab-btn flex-1 py-3 px-1 text-[11px] sm:text-sm font-semibold transition-all border-b-2 text-theme-primary border-theme-primary bg-blue-50/50 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5">
                <i class="fa-solid fa-language text-lg sm:text-base"></i> <span>영한사전</span>
            </button>
            <button onclick="switchTab('korDict')" id="tab-korDict" class="tab-btn flex-1 py-3 px-1 text-[11px] sm:text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5">
                <i class="fa-solid fa-book text-lg sm:text-base"></i> <span>국어사전</span>
            </button>
            <button onclick="switchTab('chat')" id="tab-chat" class="tab-btn flex-1 py-3 px-1 text-[11px] sm:text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5">
                <i class="fa-regular fa-comments text-lg sm:text-base"></i> <span>단순 대화</span>
            </button>
            <button onclick="switchTab('study')" id="tab-study" class="tab-btn flex-1 py-3 px-1 text-[11px] sm:text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all border-b-2 border-transparent flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5">
                <i class="fa-solid fa-graduation-cap text-lg sm:text-base"></i> <span>학습 질문</span>
            </button>
        </nav>

        <main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-4 scroll-smooth select-text bg-transparent">
            <!-- 초기 환영 메시지는 JS에서 렌더링 -->
        </main>

        <footer class="p-3 sm:p-4 bg-white/95 border-t border-gray-200/50 safe-pb z-10">
            <div class="flex gap-2 items-end">
                <textarea id="message-input" rows="1" placeholder="메시지를 입력하세요..." 
                          class="flex-1 resize-none rounded-2xl bg-gray-100 border border-gray-200 focus:bg-white focus:border-theme-primary px-4 py-3 sm:py-3.5 text-[15px] sm:text-sm transition-all max-h-32 select-text"
                          onkeydown="handleKeyDown(event)"></textarea>
                <button onclick="sendMessage()" id="send-btn" class="bg-theme-primary hover-bg-theme-primary text-white rounded-2xl w-12 h-12 sm:w-14 sm:h-auto sm:px-6 sm:py-3.5 transition-colors shadow-sm flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-paper-plane text-lg"></i>
                </button>
            </div>
        </footer>
        
        <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800/90 text-white px-5 py-2.5 rounded-full text-xs sm:text-sm shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 whitespace-nowrap text-center max-w-[90vw]">
            알림 메시지
        </div>
    </div>

    <script>
        const TABS = ['engKor', 'korDict', 'chat', 'study'];
        const THEMES = {
            'engKor': 'theme-blue', 'korDict': 'theme-green',
            'chat': 'theme-yellow', 'study': 'theme-purple'
        };

        const SYSTEM_PROMPTS = {
            'engKor': "당신은 빠르고 정확한 영한/한영 사전입니다. 한국어 입력 시 자연스러운 영어 문장/단어로 번역하고, 영어 입력 시 정확한 한국어 뜻과 해석을 제공하세요. 발음 기호와 실생활 예문 1~2개를 포함해주세요.",
            'korDict': "당신은 정확한 국어사전입니다. 단어 입력 시 다음 양식에 따라 깔끔하게 답변하세요.\n- 단어: [단어]\n- 뜻: [정확하고 이해하기 쉬운 뜻풀이]\n- 예시 문장:\n  1. [예문 1]\n  2. [예문 2]",
            'chat': "당신은 공감 능력이 뛰어난 일상 대화 파트너입니다. 사용자를 친구처럼 편안하게 대하며, 말투에 맞춰 유연하게 대답하세요. 감정에 공감하고 가벼운 질문도 던져주세요.",
            'study': "당신은 친절한 튜터입니다. 학생의 눈높이에 맞춰 복잡한 개념을 일상적인 비유로 쉽게 설명해주세요. 원리를 깨우치도록 유도하고 격려의 말을 아끼지 마세요."
        };

        // 기본 API 키 (사용자 제공)
        const DEFAULT_API_KEY = "AQ.Ab8RN6IwZGKL-b9-_wMvnDkJyZFojexzhegqxMoPrMVcztKdBw";
        let currentTab = 'engKor';
        let isLoading = false;
        
        // 기기 저장소(LocalStorage)에서 대화 기록 불러오기
        let chatHistories = { 'engKor': [], 'korDict': [], 'chat': [], 'study': [] };
        try {
            const savedData = localStorage.getItem('multiChatData');
            if (savedData) {
                chatHistories = JSON.parse(savedData);
            }
        } catch (e) { console.error("스토리지 로드 실패:", e); }

        function saveToStorage() {
            try {
                localStorage.setItem('multiChatData', JSON.stringify(chatHistories));
            } catch (e) { console.error("스토리지 저장 실패:", e); }
        }

        function clearHistory() {
            if (confirm("현재 탭의 대화 기록을 모두 지우시겠습니까?")) {
                chatHistories[currentTab] = [];
                saveToStorage();
                renderChatHistory();
                showToast("대화 기록이 삭제되었습니다.");
            }
        }

        function handleKeyDown(event) {
            const input = document.getElementById('message-input');
            setTimeout(() => {
                input.style.height = 'auto';
                input.style.height = (input.scrollHeight < 120 ? input.scrollHeight : 120) + 'px';
            }, 0);
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 3000);
        }

        function switchTab(tabId) {
            if (isLoading) {
                showToast("현재 응답을 기다리는 중입니다. 잠시 후 시도해주세요.");
                return;
            }
            currentTab = tabId;
            document.body.className = `${THEMES[tabId]} h-[100dvh] w-screen overflow-hidden flex flex-col items-center bg-gray-50 sm:p-6 text-gray-800 transition-colors duration-500 overscroll-none select-none`;

            TABS.forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                if (tab === tabId) {
                    btn.classList.add('text-theme-primary', 'border-theme-primary');
                    btn.classList.remove('text-gray-500', 'border-transparent');
                    btn.style.backgroundColor = 'rgba(255,255,255, 0.4)';
                } else {
                    btn.classList.remove('text-theme-primary', 'border-theme-primary');
                    btn.classList.add('text-gray-500', 'border-transparent');
                    btn.style.backgroundColor = 'transparent';
                }
            });
            renderChatHistory();
        }

        function formatText(text) {
            let html = text.replace(/\n/g, '<br>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return html;
        }

        function renderChatHistory() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const history = chatHistories[currentTab];
            
            if (!history || history.length === 0) {
                container.innerHTML = `<div class="flex justify-center my-4" id="welcome-message">
                    <div class="bg-black/5 text-gray-600 text-xs sm:text-sm px-4 py-2 rounded-full backdrop-blur-sm border border-gray-200/50">새로운 대화를 시작해보세요!</div>
                </div>`;
                return;
            }
            history.forEach(msg => {
                if (msg.role === 'user' || msg.role === 'model') {
                    appendMessage(msg.role, msg.parts[0].text, false);
                }
            });
            scrollToBottom();
        }

        function appendMessage(role, text, animate = true) {
            const container = document.getElementById('chat-container');
            const welcomeMsg = document.getElementById('welcome-message');
            if (welcomeMsg) welcomeMsg.remove();

            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} ${animate ? 'animate-fade-in' : ''}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[85%] sm:max-w-[75%] p-3 sm:p-4 rounded-2xl text-sm sm:text-base leading-relaxed markdown-body ${role === 'user' ? 'bubble-user rounded-br-sm' : 'bubble-bot rounded-bl-sm'}`;
            
            if(role === 'model') {
                bubble.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-theme-primary flex-shrink-0 flex items-center justify-center text-white text-xs mt-1 shadow-sm">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>${formatText(text)}</div>
                </div>`;
            } else {
                bubble.innerHTML = formatText(text);
            }

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            scrollToBottom();
        }

        let loadingElementId = null;
        function showLoading() {
            const container = document.getElementById('chat-container');
            const id = 'loading-' + Date.now();
            loadingElementId = id;
            container.insertAdjacentHTML('beforeend', `
                <div id="${id}" class="flex w-full justify-start animate-fade-in">
                    <div class="max-w-[85%] p-4 rounded-2xl bubble-bot rounded-bl-sm flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-theme-primary flex-shrink-0 flex items-center justify-center text-white text-xs shadow-sm">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="typing-indicator flex items-center h-6"><span></span><span></span><span></span></div>
                    </div>
                </div>
            `);
            scrollToBottom();
        }

        function removeLoading() {
            if (loadingElementId) {
                document.getElementById(loadingElementId)?.remove();
                loadingElementId = null;
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            if (isLoading) return;
            const inputEl = document.getElementById('message-input');
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            
            appendMessage('user', text);
            chatHistories[currentTab].push({ role: 'user', parts: [{ text: text }] });
            saveToStorage(); // 사용자 메시지 저장

            isLoading = true;
            showLoading();

            try {
                let botReply = "";

                // 1. 영한사전: 무료 MyMemory 번역 API 연동 (키 불필요)
                if (currentTab === 'engKor') {
                    const isKorean = /[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text); // 한글 포함 여부 확인
                    const langpair = isKorean ? 'ko|en' : 'en|ko';
                    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
                    
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    let translated = data.responseData.translatedText;
                    if (!translated || data.responseData.match < 0.5) {
                        botReply = "정확한 번역/사전 결과를 찾을 수 없습니다.";
                    } else {
                        botReply = `**입력어:** ${text}\n**${isKorean ? '영어' : '한국어'}:** ${translated}`;
                    }
                } 
                // 2. 국어사전: 국립국어원 한국어기초사전 Open API 연동 (CORS 프록시 사용)
                else if (currentTab === 'korDict') {
                    const dictKey = "228FD014A43A9C4B4250E0EFA8DBDDB5"; // 제공해주신 인증키 적용
                    const targetUrl = `https://krdict.korean.go.kr/api/search?key=${dictKey}&q=${encodeURIComponent(text)}&part=word&sort=dict&advanced=y`;
                    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                    
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error("국립국어원 서버와 통신할 수 없습니다.");
                    const xmlText = await res.text();
                    
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    const items = xmlDoc.getElementsByTagName('item');
                    
                    if (items.length === 0) {
                        botReply = `'${text}'에 대한 국어사전 검색 결과가 없습니다.`;
                    } else {
                        const word = items[0].getElementsByTagName('word')[0]?.textContent || text;
                        const pos = items[0].getElementsByTagName('pos')[0]?.textContent || '품사 없음';
                        const definition = items[0].getElementsByTagName('definition')[0]?.textContent || '뜻풀이 없음';
                        botReply = `**단어:** ${word} [${pos}]\n**뜻:** ${definition}`;
                    }
                }
                // 3. 그 외 탭 (단순대화, 학습질문): Gemini API 연동
                else {
                    const userKey = document.getElementById('api-key-input').value.trim();
                    const apiKey = userKey || DEFAULT_API_KEY; 

                    // API 키 형식 사전 검증 (AIza로 시작하는지 확인)
                    if (!apiKey.startsWith('AIza')) {
                        throw new Error("유효하지 않은 API 키입니다.\n구글 Gemini API 키는 반드시 'AIza'로 시작해야 합니다. 화면 우상단의 🔑 칸에 올바른 키를 입력해 주세요.");
                    }

                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

                    const recentHistory = chatHistories[currentTab].slice(-6);
                    
                    const payload = {
                        contents: recentHistory,
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPTS[currentTab] }] },
                        generationConfig: {
                            temperature: currentTab === 'chat' ? 0.7 : 0.2,
                            maxOutputTokens: 800
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        const errMsg = errData.error?.message || response.statusText;
                        
                        if (response.status === 429 || errMsg.toLowerCase().includes('quota')) {
                            throw new Error("할당량 초과 또는 올바르지 않은 키입니다.\n화면 우상단 🔑 칸에 'AIza'로 시작하는 유효한 API 키를 넣어주세요.");
                        }
                        if (response.status === 503) {
                            throw new Error("서버가 혼잡합니다. 잠시 후 다시 시도해주세요.");
                        }
                        throw new Error(errMsg);
                    }

                    const result = await response.json();
                    botReply = "응답을 생성할 수 없습니다.";
                    if (result.candidates && result.candidates[0].content?.parts?.length > 0) {
                        botReply = result.candidates[0].content.parts[0].text;
                    }
                }

                removeLoading();
                appendMessage('model', botReply);
                
                chatHistories[currentTab].push({ role: 'model', parts: [{ text: botReply }] });
                saveToStorage(); // 봇 응답 저장

            } catch (error) {
                console.error("API 호출 에러:", error);
                removeLoading();
                
                let errorMsg = `⚠️ 오류: ${error.message}`;
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMsg = "⚠️ 네트워크 차단 또는 API 통신 중 오류가 발생했습니다.\n광고 차단기나 네트워크를 확인해 주세요.";
                }
                
                appendMessage('model', errorMsg);
                chatHistories[currentTab].pop(); // 에러 시 마지막 유저 질문 롤백
                saveToStorage(); // 롤백된 상태 저장
            } finally {
                isLoading = false;
                document.getElementById('message-input').focus();
            }
        }

        // 앱 로드 시 초기 렌더링
        window.onload = () => {
            renderChatHistory();
            document.getElementById('message-input').focus();
        };
    </script>
</body>
</html>
